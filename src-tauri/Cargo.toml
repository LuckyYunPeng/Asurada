[package]
name = "commitdock"
version = "0.1.0"
description = "Asurada — edge-docked git commit & push helper for macOS"
authors = ["CommitDock Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "commitdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

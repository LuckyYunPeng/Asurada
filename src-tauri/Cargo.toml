[package]
name = "asurada"
version = "0.7.0"
description = "A macOS edge-dock app for reviewing AI-written changes: filter the noise, then commit & push in one click."
authors = ["Asurada Contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "asurada_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dock 在 dev 模式下显示可执行文件名
[[bin]]
name = "Asurada"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
block2 = "0.6"
dispatch2 = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "block2", "NSWorkspace", "NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSArray", "NSString", "NSLocale"] }
rfd = "0.17"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
